<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>倚盟電訊 班表查詢</title>
<style>
  :root {
    --border-c: #d8d8d8;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 16px;
    color: #222;
  }
  .wrap {
    max-width: 960px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    font-size: 20px;
    color: #1b1b1b;
    margin-bottom: 14px;
  }
  .controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .controls button {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border-c);
    background: white;
    font-size: 15px;
    cursor: pointer;
  }
  .controls button:hover { background: #eef6ee; }
  .controls select, .controls input[type=date] {
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border-c);
    font-size: 15px;
    background: white;
    min-width: 150px;
    flex-shrink: 0;
    box-sizing: border-box;
  }
  @media (max-width: 420px) {
    .controls input[type=date] {
      flex: 1 1 100%;
      order: -1;
      min-width: 0;
      width: 100%;
    }
  }
  .hint {
    text-align: center;
    color: #888;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .date-banner {
    background: #FFF6C9;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    font-size: 20px;
    font-weight: bold;
    color: #C0392B;
    margin-bottom: 16px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  th, td {
    border: 1px solid var(--border-c);
    padding: 8px 4px;
    text-align: center;
    font-size: 14px;
    vertical-align: top;
  }
  thead th {
    background: #228B22;
    color: white;
    font-size: 15px;
    padding: 10px 4px;
  }
  td.namecell { padding: 6px 4px; }
  .staffline {
    padding: 4px 2px;
    border-radius: 6px;
    margin: 2px 0;
  }
  .staffline.manager {
    background: #FFE1BE;
    font-weight: bold;
  }
  .staffline.support {
    color: #666;
    font-style: italic;
  }
  .coef-row td {
    background: #E4F5DE;
    font-weight: bold;
    color: #2b6b2b;
  }
  footer {
    text-align: center;
    color: #999;
    font-size: 12px;
    margin-top: 18px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>倚盟電訊 每日班表查詢</h1>
  <div class="controls">
    <button id="prevBtn">◀ 前一天</button>
    <button id="todayBtn">今天</button>
    <button id="nextBtn">後一天 ▶</button>
    <input type="date" id="datePicker" min="2026-08-01" max="2026-08-31" value="2026-08-01">
  </div>
  <div class="hint">📅 點選上方日期欄可直接挑選日期</div>
  <div class="date-banner" id="dateBanner"></div>
  <table>
    <thead><tr id="headerRow"></tr></thead>
    <tbody><tr id="bodyRow"></tr></tbody>
    <tbody><tr class="coef-row" id="coefRow"></tr></tbody>
  </table>
  <footer>資料如有異動請聯繫倚盟管理部更新</footer>
</div>

const STORES = ["鼎山", "陽明", "後昌", "仁雄", "凱旋"];
const MANAGERS = new Set(["劉家妘", "郭家維", "陳宛姍", "黃傑稜", "黃庭鈞"]);
const WEEKDAY_CN = ['日','一','二','三','四','五','六'];

const datePicker = document.getElementById('datePicker');
const dateBanner = document.getElementById('dateBanner');
const headerRow = document.getElementById('headerRow');
const bodyRow = document.getElementById('bodyRow');
const coefRow = document.getElementById('coefRow');

function fmtISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function render(iso) {
  const d = new Date(iso + 'T00:00:00');
  const wd = d.getDay(); // 0=Sun
  const isSunday = (wd === 0);
  const cols = isSunday ? STORES : STORES.concat(['總部']);

  dateBanner.textContent = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} 星期${WEEKDAY_CN[wd]}`;

  headerRow.innerHTML = cols.map(s => `<th>${s}</th>`).join('');

  const dayData = SCHEDULE[iso] || {};

  bodyRow.innerHTML = cols.map(store => {
    const sd = dayData[store];
    if (!sd || !sd.a || sd.a.length === 0) {
      return `<td class="namecell">-</td>`;
    }
    const lines = sd.a.map(([name, type]) => {
      const cls = MANAGERS.has(name) ? 'staffline manager' : (type === 'support' ? 'staffline support' : 'staffline');
      const label = type === 'support' ? `${name}(支援)` : name;
      return `<div class="${cls}">${label}</div>`;
    }).join('');
    return `<td class="namecell">${lines}</td>`;
  }).join('');

  coefRow.innerHTML = cols.map(store => {
    if (store === '總部') return `<td>-</td>`;
    const sd = dayData[store];
    const c = sd && sd.c != null ? sd.c.toFixed(2) : '-';
    return `<td>${c}</td>`;
  }).join('');
}

function goTo(iso) {
  datePicker.value = iso;
  render(iso);
}

document.getElementById('prevBtn').addEventListener('click', () => {
  const d = new Date(datePicker.value + 'T00:00:00');
  d.setDate(d.getDate() - 1);
  goTo(fmtISO(d));
});
document.getElementById('nextBtn').addEventListener('click', () => {
  const d = new Date(datePicker.value + 'T00:00:00');
  d.setDate(d.getDate() + 1);
  goTo(fmtISO(d));
});
document.getElementById('todayBtn').addEventListener('click', () => {
  const today = new Date();
  let iso = fmtISO(today);
  if (!SCHEDULE[iso]) iso = '2026-08-01';
  goTo(iso);
});
datePicker.addEventListener('change', () => render(datePicker.value));

// initial render: today if within August 2026, else Aug 1
(function init() {
  const today = new Date();
  let iso = fmtISO(today);
  if (!SCHEDULE[iso]) iso = '2026-08-01';
  goTo(iso);
})();
</script>
